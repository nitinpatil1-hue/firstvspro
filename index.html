<!DOCTYPE html>
<html>
<head>
    <title>Jenkins and Git Diagram</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .box {
            display: inline-block;
            padding: 20px;
            margin: 20px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #f2f2f2;
        }
        .arrow {
            font-size: 30px;
            margin: 0 20px;
        }
    </style>
</head>
<body>
    <h1>Basic Jenkins and Git Diagram</h1>
    <div class="box">Git Repository</div>
    <span class="arrow">➡️</span>
    <div class="box">Jenkins Server</div>
    <span class="arrow">➡️</span>
    <div class="box">Build & Test</div>
    <span class="arrow">➡️</span>
    <div class="box">Deployment</div>
</body>
</html>
